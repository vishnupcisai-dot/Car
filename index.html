<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Server Shape with Text</title>
    <style>
        * {
            margin: 0;
            overflow: hidden; 
        }
        .text{
            position: absolute;
            color: white;
            width: 100%;
            text-align: center;
            top: 50px;
            font-size: 3vw;
            z-index: 10;
            font-family: sans-serif;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
          }
        }
    </script>
</head>
<div class="text">Custom car model</div>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); 
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 4, 16); 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        renderer.setAnimationLoop(animate);

        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; 
        controls.dampingFactor = 0.1;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

       // create Box 
        const geometry = new THREE.BoxGeometry( 6, 1, 4 );
        const material = new THREE.MeshPhongMaterial( { color: 0x00ff00 } );
        const carBody = new THREE.Mesh( geometry, material );
        scene.add( carBody );

        // car veel 
        const carveel = new THREE.CylinderGeometry( 0.72, 0.72, 0.5, 72 );
        const carmeterial = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe:true } );
        const cartair = new THREE.Mesh( carveel, carmeterial );

        cartair.position.set(-2,0,2.3);
        cartair.rotation.x = Math.PI / 2;
        scene.add( cartair );

        // car veel2
        const cartair2 = new THREE.Mesh( carveel, carmeterial );

        cartair2.position.set(-2,0,-2.3);
        cartair2.rotation.x = Math.PI / 2;
        scene.add( cartair2 );

        // car veel3
        const cartair3 = new THREE.Mesh( carveel, carmeterial );

        cartair3.position.set(2,0,2.3);
        cartair3.rotation.x = Math.PI / 2;
        scene.add( cartair3 );

        // car veel2
        const cartair4 = new THREE.Mesh( carveel, carmeterial );

        cartair4.position.set(2,0,-2.3);
        cartair4.rotation.x = Math.PI / 2;
        scene.add( cartair4 );

        //bodyTop2
        const bodyTop2 = new THREE.BoxGeometry( 5, 0.7, 3.1 );
        const carTop2 = new THREE.Mesh( bodyTop2, material );
        carTop2.position.y = 0.7;
        scene.add( carTop2 );

        // body top 
        const bodyTop = new THREE.CylinderGeometry( 1.2, 1.8, 1.5, 4, 12 );
        const bodyTopmaterial = new THREE.MeshPhongMaterial( { color: 0x00ff00 } );
        const bodyTop1 = new THREE.Mesh( bodyTop, bodyTopmaterial );
        bodyTop1.position.y = 1.7;
        bodyTop1.rotation.y = 3.9;
        scene.add( bodyTop1 );



        // --- Animation Loop ---
        function animate(time){
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
